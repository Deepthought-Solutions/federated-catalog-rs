# Minimal config pointing the dsp-tck at this project's http-api, running
# on the host (see README.md). Not the sample.tck.properties file from
# eclipse-dataspacetck/dsp-tck - trimmed to what a first baseline run
# needs, since http-api does not implement the DSP wire protocol yet.
dataspacetck.debug=true
dataspacetck.dsp.local.connector=false
dataspacetck.dsp.connector.agent.id=urn:connector:federated-catalog-rs
dataspacetck.dsp.connector.http.url=http://host.docker.internal:18080/dsp
dataspacetck.dsp.connector.http.base.url=http://host.docker.internal:18080
dataspacetck.dsp.connector.negotiation.initiate.url=http://host.docker.internal:18080/negotiations
dataspacetck.dsp.connector.transfer.initiate.url=http://host.docker.internal:18080/transfers
# Short wait: http-api doesn't implement contract negotiation or transfer
# process yet, so those tests are expected to fail fast, not hang for the
# sample file's multi-hour default.
dataspacetck.dsp.default.wait=5000
CAT_01_01_DATASETID=sample-dataset
