[package]
name = "crawler"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Scheduled catalog crawler: polls a local-config participant registry's DSP catalog endpoints (with optional DCP holder support) and upserts results into rdf-store's CatalogCache."

[dependencies]
catalog-core = { path = "../catalog-core" }
rdf-store = { path = "../rdf-store" }
dcp-core = { path = "../dcp-core" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Only for crates/crawler/tests/multi_participant_crawl.rs - a hermetic
# multi-instance integration test that runs real http-api server instances
# in-process. Not needed by any library code in this crate.
http-api = { path = "../http-api" }
axum = { workspace = true }
tracing-subscriber = { workspace = true }
