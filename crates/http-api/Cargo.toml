[package]
name = "http-api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Axum HTTP server for the Federated Catalog Semantic Harvester: a dsp-tck-verified DSP catalog protocol surface, an internal Management-API-style aggregate view, and optional DCP-gated auth over the rdf-store cache trait."

[[bin]]
name = "http-api"
path = "src/main.rs"

[dependencies]
catalog-core = { path = "../catalog-core" }
rdf-store = { path = "../rdf-store" }
dcp-core = { path = "../dcp-core" }
crawler = { path = "../crawler" }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
p256 = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
tower = { workspace = true }
http-body-util = "0.1"
