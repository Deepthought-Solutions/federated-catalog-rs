<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" role="img"
     aria-label="Internal architecture of the semantic cache. crates/crawler parses a crawled DSP response into a catalog_core::Catalog domain value and upserts it through the CatalogCache trait. The Oxigraph-backed implementation stores each origin node as its own named graph. Today that graph holds a single opaque JSON-literal triple, which is a real gap: it cannot support meaningful SPARQL queries over dataset properties. Real RDF decomposition of Dataset, Offer, and Distribution into actual triples is required, not optional, for this product's two serving surfaces: a per-participant dataset list and a SPARQL query endpoint. Neither surface answers the Dataspace Protocol's own CatalogRequestMessage.">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f8fafc; stroke: #334155; stroke-width: 1.5; }
    .trait { fill: #fffbeb; stroke: #b45309; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .cache { fill: #ecfdf5; stroke: #047857; stroke-width: 1.5; }
    .graph { fill: #ffffff; stroke: #047857; stroke-width: 1; }
    .gap { fill: #fef2f2; stroke: #b91c1c; stroke-width: 1.5; }
    .label { fill: #0f172a; font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; font-size: 13px; }
    .sublabel { fill: #1e293b; font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; font-size: 11.5px; }
    .mono { fill: #1e293b; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
    .caption { fill: #475569; font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; font-size: 11px; }
    .title { fill: #0f172a; font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; }
    .traittext { fill: #92400e; }
    .cachetext { fill: #065f46; }
    .gaptext { fill: #991b1b; }
    .flow { stroke: #334155; stroke-width: 1.5; fill: none; }
    .read { stroke: #6d28d9; stroke-width: 1.5; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b1220; }
      .box { fill: #111827; stroke: #94a3b8; }
      .trait { fill: #2a1e05; stroke: #fbbf24; }
      .cache { fill: #052e21; stroke: #34d399; }
      .graph { fill: #0b1220; stroke: #34d399; }
      .gap { fill: #2a0e0e; stroke: #f87171; }
      .label { fill: #e2e8f0; }
      .sublabel { fill: #e2e8f0; }
      .mono { fill: #cbd5e1; }
      .caption { fill: #94a3b8; }
      .title { fill: #f1f5f9; }
      .traittext { fill: #fde68a; }
      .cachetext { fill: #6ee7b7; }
      .gaptext { fill: #fca5a5; }
      .flow { stroke: #94a3b8; }
      .read { stroke: #a78bfa; }
    }
  </style>
  <defs>
    <marker id="arrow-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155" />
    </marker>
    <marker id="arrow-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="980" height="660" />

  <text class="title" x="490" y="26" text-anchor="middle">Internal architecture: the semantic cache</text>
  <text class="caption" x="490" y="44" text-anchor="middle">crates/crawler → catalog_core::Catalog → CatalogCache trait → OxigraphCatalogCache</text>

  <!-- crawler -->
  <rect class="box" x="40" y="64" width="230" height="72" rx="6" />
  <text class="label" x="155" y="88" text-anchor="middle">crawler::crawl_once</text>
  <text class="sublabel" x="155" y="108" text-anchor="middle">parse_catalog_response()</text>
  <text class="caption" x="155" y="124" text-anchor="middle">one crawled participant's JSON</text>

  <!-- domain type -->
  <rect class="box" x="310" y="64" width="230" height="72" rx="6" />
  <text class="label" x="425" y="88" text-anchor="middle">catalog_core::Catalog</text>
  <text class="sublabel" x="425" y="108" text-anchor="middle">domain value</text>
  <text class="caption" x="425" y="124" text-anchor="middle">Dataset / DataService / origin_node</text>

  <!-- trait -->
  <rect class="trait" x="580" y="64" width="230" height="72" rx="6" />
  <text class="traittext title" x="695" y="88" text-anchor="middle">CatalogCache (trait)</text>
  <text class="traittext sublabel" x="695" y="108" text-anchor="middle">upsert() / query() / delete()</text>
  <text class="traittext caption" x="695" y="124" text-anchor="middle">backend-agnostic on purpose</text>

  <path class="flow" marker-end="url(#arrow-flow)" d="M 270,100 L 310,100" />
  <path class="flow" marker-end="url(#arrow-flow)" d="M 540,100 L 580,100" />

  <!-- OxigraphCatalogCache -->
  <rect class="cache" x="140" y="164" width="700" height="210" rx="8" />
  <text class="cachetext title" x="490" y="190" text-anchor="middle">OxigraphCatalogCache</text>
  <text class="cachetext caption" x="490" y="208" text-anchor="middle">rdf_store::oxigraph_backend — built on contreforts_kg::GraphStore (Oxigraph)</text>

  <!-- named graphs -->
  <rect class="graph" x="170" y="226" width="200" height="122" rx="6" />
  <text class="label" x="270" y="248" text-anchor="middle">Named graph: node A</text>
  <text class="mono" x="270" y="270" text-anchor="middle">&lt;node-A-iri&gt;</text>
  <text class="mono" x="270" y="286" text-anchor="middle">catalogJson</text>
  <text class="mono" x="270" y="302" text-anchor="middle">"{...whole Catalog</text>
  <text class="mono" x="270" y="316" text-anchor="middle">as JSON literal...}"</text>
  <text class="caption" x="270" y="338" text-anchor="middle">one opaque triple today — the gap below</text>

  <rect class="graph" x="390" y="226" width="200" height="122" rx="6" />
  <text class="label" x="490" y="248" text-anchor="middle">Named graph: node B</text>
  <text class="mono" x="490" y="270" text-anchor="middle">&lt;node-B-iri&gt;</text>
  <text class="mono" x="490" y="286" text-anchor="middle">catalogJson</text>
  <text class="mono" x="490" y="302" text-anchor="middle">"{...whole Catalog</text>
  <text class="mono" x="490" y="316" text-anchor="middle">as JSON literal...}"</text>
  <text class="caption" x="490" y="338" text-anchor="middle">same shape, different graph</text>

  <rect class="graph" x="610" y="226" width="200" height="122" rx="6" stroke-dasharray="4 3" />
  <text class="label" x="710" y="248" text-anchor="middle">Named graph: node N</text>
  <text class="caption" x="710" y="270" text-anchor="middle">…one graph per</text>
  <text class="caption" x="710" y="286" text-anchor="middle">crawled origin node,</text>
  <text class="caption" x="710" y="302" text-anchor="middle">re-crawled = replaced</text>
  <text class="caption" x="710" y="318" text-anchor="middle">wholesale on upsert()</text>

  <!-- the real gap, promoted, not a footnote -->
  <rect class="gap" x="170" y="396" width="640" height="92" rx="6" />
  <text class="gaptext title" x="490" y="420" text-anchor="middle">Gap: not yet a real triple store</text>
  <text class="gaptext sublabel" x="490" y="440" text-anchor="middle">One opaque JSON-literal triple per graph cannot support meaningful SPARQL over</text>
  <text class="gaptext sublabel" x="490" y="456" text-anchor="middle">dataset properties. Needs real Dataset/Offer/Distribution/DataService triples and a</text>
  <text class="gaptext sublabel" x="490" y="472" text-anchor="middle">real vocabulary (DCAT/ODRL, matching what DSP itself reuses) — see gap analysis doc</text>

  <!-- http-api reads, this product's ONLY two serving surfaces -->
  <rect class="box" x="170" y="520" width="320" height="64" rx="6" />
  <text class="label" x="330" y="544" text-anchor="middle">http-api: dataset list per participant</text>
  <text class="caption" x="330" y="564" text-anchor="middle">non-DSP</text>

  <rect class="box" x="520" y="520" width="290" height="64" rx="6" />
  <text class="label" x="665" y="544" text-anchor="middle">http-api: SPARQL endpoint</text>
  <text class="caption" x="665" y="564" text-anchor="middle">missing today — needs the fix above first</text>

  <path class="read" marker-end="url(#arrow-read)" d="M 330,520 L 330,488" />
  <path class="read" marker-end="url(#arrow-read)" d="M 665,520 L 665,488" />
  <text class="caption" x="490" y="504" text-anchor="middle">query() / SPARQL evaluation</text>

  <text class="caption" x="490" y="616" text-anchor="middle">Neither surface answers the DSP CatalogRequestMessage — that's the connector's other components' job</text>
</svg>
