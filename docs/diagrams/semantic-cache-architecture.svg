<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" role="img"
     aria-label="Internal architecture of the semantic cache. crates/crawler parses a crawled DSP response into a catalog_core::Catalog domain value and upserts it through the CatalogCache trait. The Oxigraph-backed implementation stores each origin node as its own named graph, currently as a single triple carrying the whole catalog serialized as a JSON literal, via contreforts-kg's GraphStore. Both http-api routes read back through the same trait, so the backend is an implementation detail neither route depends on. Full RDF decomposition of Dataset, Offer, and Distribution into real triples is documented future work, noted separately below.">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f8fafc; stroke: #334155; stroke-width: 1.5; }
    .trait { fill: #fffbeb; stroke: #b45309; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .cache { fill: #ecfdf5; stroke: #047857; stroke-width: 1.5; }
    .graph { fill: #ffffff; stroke: #047857; stroke-width: 1; }
    .future { fill: #fef2f2; stroke: #b91c1c; stroke-width: 1.25; stroke-dasharray: 5 3; }
    .label { fill: #0f172a; font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; font-size: 13px; }
    .sublabel { fill: #1e293b; font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; font-size: 11.5px; }
    .mono { fill: #1e293b; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
    .caption { fill: #475569; font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; font-size: 11px; }
    .title { fill: #0f172a; font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; }
    .traittext { fill: #92400e; }
    .cachetext { fill: #065f46; }
    .futuretext { fill: #991b1b; }
    .flow { stroke: #334155; stroke-width: 1.5; fill: none; }
    .read { stroke: #6d28d9; stroke-width: 1.5; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b1220; }
      .box { fill: #111827; stroke: #94a3b8; }
      .trait { fill: #2a1e05; stroke: #fbbf24; }
      .cache { fill: #052e21; stroke: #34d399; }
      .graph { fill: #0b1220; stroke: #34d399; }
      .future { fill: #2a0e0e; stroke: #f87171; }
      .label { fill: #e2e8f0; }
      .sublabel { fill: #e2e8f0; }
      .mono { fill: #cbd5e1; }
      .caption { fill: #94a3b8; }
      .title { fill: #f1f5f9; }
      .traittext { fill: #fde68a; }
      .cachetext { fill: #6ee7b7; }
      .futuretext { fill: #fca5a5; }
      .flow { stroke: #94a3b8; }
      .read { stroke: #a78bfa; }
    }
  </style>
  <defs>
    <marker id="arrow-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155" />
    </marker>
    <marker id="arrow-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="980" height="640" />

  <text class="title" x="490" y="28" text-anchor="middle">Internal architecture: the semantic cache</text>
  <text class="caption" x="490" y="46" text-anchor="middle">crates/crawler → catalog_core::Catalog → CatalogCache trait → OxigraphCatalogCache</text>

  <!-- crawler -->
  <rect class="box" x="40" y="66" width="230" height="72" rx="6" />
  <text class="label" x="155" y="90" text-anchor="middle">crawler::crawl_once</text>
  <text class="sublabel" x="155" y="110" text-anchor="middle">parse_catalog_response()</text>
  <text class="caption" x="155" y="126" text-anchor="middle">one crawled participant's JSON</text>

  <!-- domain type -->
  <rect class="box" x="310" y="66" width="230" height="72" rx="6" />
  <text class="label" x="425" y="90" text-anchor="middle">catalog_core::Catalog</text>
  <text class="sublabel" x="425" y="110" text-anchor="middle">domain value</text>
  <text class="caption" x="425" y="126" text-anchor="middle">Dataset / DataService / origin_node</text>

  <!-- trait -->
  <rect class="trait" x="580" y="66" width="230" height="72" rx="6" />
  <text class="traittext title" x="695" y="90" text-anchor="middle">CatalogCache (trait)</text>
  <text class="traittext sublabel" x="695" y="110" text-anchor="middle">upsert() / query() / delete()</text>
  <text class="traittext caption" x="695" y="126" text-anchor="middle">backend-agnostic on purpose</text>

  <path class="flow" marker-end="url(#arrow-flow)" d="M 270,102 L 310,102" />
  <path class="flow" marker-end="url(#arrow-flow)" d="M 540,102 L 580,102" />

  <!-- OxigraphCatalogCache -->
  <rect class="cache" x="140" y="176" width="700" height="216" rx="8" />
  <text class="cachetext title" x="490" y="202" text-anchor="middle">OxigraphCatalogCache</text>
  <text class="cachetext caption" x="490" y="220" text-anchor="middle">rdf_store::oxigraph_backend — built on contreforts_kg::GraphStore (Oxigraph)</text>

  <!-- named graphs -->
  <rect class="graph" x="170" y="240" width="200" height="128" rx="6" />
  <text class="label" x="270" y="262" text-anchor="middle">Named graph: node A</text>
  <text class="mono" x="270" y="284" text-anchor="middle">&lt;node-A-iri&gt;</text>
  <text class="mono" x="270" y="300" text-anchor="middle">catalogJson</text>
  <text class="mono" x="270" y="316" text-anchor="middle">"{...whole Catalog</text>
  <text class="mono" x="270" y="330" text-anchor="middle">as JSON literal...}"</text>
  <text class="caption" x="270" y="354" text-anchor="middle">one triple per graph today</text>

  <rect class="graph" x="390" y="240" width="200" height="128" rx="6" />
  <text class="label" x="490" y="262" text-anchor="middle">Named graph: node B</text>
  <text class="mono" x="490" y="284" text-anchor="middle">&lt;node-B-iri&gt;</text>
  <text class="mono" x="490" y="300" text-anchor="middle">catalogJson</text>
  <text class="mono" x="490" y="316" text-anchor="middle">"{...whole Catalog</text>
  <text class="mono" x="490" y="330" text-anchor="middle">as JSON literal...}"</text>
  <text class="caption" x="490" y="354" text-anchor="middle">"first cut" JSON-blob bridge</text>

  <rect class="graph" x="610" y="240" width="200" height="128" rx="6" stroke-dasharray="4 3" />
  <text class="label" x="710" y="262" text-anchor="middle">Named graph: node N</text>
  <text class="caption" x="710" y="284" text-anchor="middle">…one graph per</text>
  <text class="caption" x="710" y="300" text-anchor="middle">crawled origin node,</text>
  <text class="caption" x="710" y="316" text-anchor="middle">re-crawled = replaced</text>
  <text class="caption" x="710" y="332" text-anchor="middle">wholesale on upsert()</text>

  <!-- http-api reads, directly below the cache -->
  <rect class="box" x="170" y="428" width="320" height="64" rx="6" />
  <text class="label" x="330" y="452" text-anchor="middle">http-api: GET /catalog</text>
  <text class="caption" x="330" y="472" text-anchor="middle">internal aggregate view</text>

  <rect class="box" x="520" y="428" width="290" height="64" rx="6" />
  <text class="label" x="665" y="452" text-anchor="middle">http-api: POST /dsp/catalog/request</text>
  <text class="caption" x="665" y="472" text-anchor="middle">DSP-conformant, this connector's own catalog</text>

  <path class="read" marker-end="url(#arrow-read)" d="M 330,428 L 330,392" />
  <path class="read" marker-end="url(#arrow-read)" d="M 665,428 L 665,392" />
  <text class="caption" x="440" y="412" text-anchor="middle">query()</text>

  <!-- future work, as a separate footnote below, out of the query flow -->
  <rect class="future" x="170" y="524" width="640" height="76" rx="6" />
  <text class="futuretext title" x="490" y="548" text-anchor="middle">Documented future work — not yet built</text>
  <text class="futuretext sublabel" x="490" y="568" text-anchor="middle">Full RDF decomposition: Dataset / Offer / Distribution as real triples and a real</text>
  <text class="futuretext caption" x="490" y="584" text-anchor="middle">vocabulary, instead of one opaque JSON-literal triple per named graph</text>
</svg>
